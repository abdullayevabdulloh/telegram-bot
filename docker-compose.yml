services:
  mongo:
    image: mongo:8
    restart: unless-stopped
    ports: ["27017:27017"]
    volumes: [mongo-data:/data/db]

  redis:
    image: redis:7
    restart: unless-stopped
    # BullMQ talabi: noeviction; AOF — qayta ishga tushganda navbat saqlanib qoladi
    command: ["redis-server", "--maxmemory-policy", "noeviction", "--appendonly", "yes"]
    ports: ["6379:6379"]
    volumes: [redis-data:/data]

volumes:
  mongo-data:
  redis-data:
